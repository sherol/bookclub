<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFA726}a:hover{color:#FFE082}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B111B; color: #F2F4F8; font-family: 'Nunito Sans', sans-serif; font-size: 15px; display: flex; flex-direction: column">
  <header style="padding: 20px 20px 16px; background: #111A28; color: #FFFFFF; border-bottom: 1px solid #24324A">
    <div style="font-size: 13px; color: #A9B7C9">Sunday, Oct 18</div>
    <h1 style="margin: 4px 0 0; font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700">Today</h1>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <section style="background: #16202F; border: 1px solid #24324A; border-radius: 14px; padding: 16px">
      <div style="font-size: 13px; color: #8FA0B5">Drafting · [Series] · Book 2</div>
      <h2 style="margin: 2px 0 12px; font-size: 18px; font-weight: 600">[Working title B]</h2>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: 'Fredoka', sans-serif; font-size: 44px; font-weight: 700; color: #FFA726">{{written}}</span>
        <span style="color: #8FA0B5">of 1,020 words stashed today</span>
      </div>
      <div role="img" aria-label="{{barLabel}}" style="height: 10px; border-radius: 5px; background: #24324A; overflow: hidden; margin: 10px 0 8px">
        <div style="{{barStyle}}"></div>
      </div>
      <div style="font-size: 13px; color: #8FA0B5">41,300 / 85,000 words · draft due Dec 19 · your pace 640 words/hour</div>
    </section>

    <section style="background: #16202F; border: 1px solid #24324A; border-radius: 14px; padding: 16px">
      <h2 style="margin: 0 0 12px; font-size: 16px; font-weight: 600">Log a session</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #8FA0B5">Words added
          <input type="number" value="600" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #3A4A63; border-radius: 10px; background: #0B111B; font: inherit; font-size: 16px; color: #F2F4F8">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #8FA0B5">Minutes
          <input type="number" value="55" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #3A4A63; border-radius: 10px; background: #0B111B; font: inherit; font-size: 16px; color: #F2F4F8">
        </label>
      </div>
      <button type="button" onClick="{{logIt}}" style="width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: #FF8F00; color: #0B111B; font: inherit; font-weight: 600; cursor: pointer">{{logLabel}}</button>
    </section>

    <section>
      <h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">This week</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 12px; background: #16202F; border: 1px solid #24324A; border-radius: 10px">
          <input type="checkbox" style="width: 20px; height: 20px; accent-color: #FFA726">
          <span style="flex: 1">Apply line edits, ch. 9–14<br><span style="font-size: 12px; color: #FF7B72; font-weight: 600">[Working title A] · overdue 2 days</span></span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 12px; background: #16202F; border: 1px solid #24324A; border-radius: 10px">
          <input type="checkbox" style="width: 20px; height: 20px; accent-color: #FFA726">
          <span style="flex: 1">Approve ISBN list for 3 formats<br><span style="font-size: 12px; color: #8FA0B5">[Working title D] · due Tue</span></span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 12px; background: #16202F; border: 1px solid #24324A; border-radius: 10px">
          <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #FFA726">
          <span style="flex: 1; color: #8FA0B5; text-decoration: line-through">Post weekly club check-in</span>
        </label>
      </div>
    </section>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #24324A; background: #16202F">
    <a href="Main.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #8FA0B5; font-size: 13px">Board</a>
    <a href="#" style="min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFA726; font-size: 13px; font-weight: 600; border-top: 3px solid #FFA726">Today</a>
    <a href="#" style="min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #8FA0B5; font-size: 13px">Bible</a>
    <a href="Club.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #8FA0B5; font-size: 13px">Club</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const logged = this.state && this.state.logged;
const words = logged ? 1020 : 420;
const pct = Math.min(100, Math.round(words / 1020 * 100));
return {
  written: words.toLocaleString('en-US'),
  barLabel: pct + '% of today’s target',
  barStyle: 'height: 10px; width: ' + pct + '%; background: ' + (pct >= 100 ? '#66BB6A' : '#FF8F00'),
  logLabel: logged ? 'Logged · target met' : 'Log session',
  logIt: () => this.setState({ logged: true })
};
}
}
</script>
</body>
</html>
